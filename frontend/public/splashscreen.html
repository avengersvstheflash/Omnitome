<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnitome</title>
  <!-- Omnitome Splash: Unpacking neural engine... -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background-color: #0a0c14;
      color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 22px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      -webkit-app-region: drag;
      box-shadow: inset 0 0 50px rgba(168, 85, 247, 0.08);
      position: relative;
    }

    /* Ambient background glow */
    .glow-bg {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 150px;
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.16) 0%, rgba(10, 12, 20, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header / Logo */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1;
    }

    .header-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    /* Book Stage */
    .stage {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      margin-top: 6px;
    }

    /* Floating Book Container */
    .book-wrapper {
      position: relative;
      animation: book-float 3s ease-in-out infinite;
    }

    @keyframes book-float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* 3D Book Layout */
    .book {
      position: relative;
      width: 110px;
      height: 72px;
      perspective: 700px;
      transform-style: preserve-3d;
    }

    /* Hard covers */
    .book-cover {
      position: absolute;
      top: 0;
      width: 55px;
      height: 72px;
      background: linear-gradient(135deg, #4c1d95 0%, #2e1065 100%);
      border: 1px solid rgba(192, 132, 252, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }

    .book-cover.left {
      left: 0;
      border-radius: 4px 0 0 4px;
      transform-origin: right center;
    }

    .book-cover.right {
      right: 0;
      border-radius: 0 4px 4px 0;
      transform-origin: left center;
    }

    /* Static inner pages (left & right bases) */
    .page-base {
      position: absolute;
      top: 3px;
      width: 50px;
      height: 66px;
      box-shadow: inset 0 0 8px rgba(139, 92, 246, 0.2);
    }

    .page-base.left {
      left: 3px;
      border-radius: 3px 0 0 3px;
      background: linear-gradient(to left, #e0e7ff 0%, #ede9fe 100%);
    }

    .page-base.right {
      right: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(to right, #e0e7ff 0%, #f5f3ff 100%);
    }

    /* Subtle text line markings on pages */
    .page-lines {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 5px,
        rgba(139, 92, 246, 0.25) 5px,
        rgba(139, 92, 246, 0.25) 7px
      );
      border-radius: 1px;
    }

    /* Book Spine */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 4px;
      height: 72px;
      background: #1e1b4b;
      border-left: 1px solid rgba(192, 132, 252, 0.3);
      border-right: 1px solid rgba(192, 132, 252, 0.3);
      z-index: 5;
    }

    /* 3D Flipping Pages */
    .flipping-page {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 50px;
      height: 66px;
      background: linear-gradient(to right, #ede9fe 0%, #f5f3ff 100%);
      border-radius: 0 3px 3px 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      backface-visibility: visible;
      animation: flip-page 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      box-shadow: inset 2px 0 4px rgba(124, 58, 237, 0.15);
      z-index: 4;
    }

    .flipping-page .page-lines {
      backface-visibility: hidden;
    }

    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 0.8s; }
    .p3 { animation-delay: 1.6s; }

    @keyframes flip-page {
      0% {
        transform: rotateY(0deg);
        background: #f5f3ff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      45% {
        background: #ddd6fe;
        box-shadow: -8px 8px 18px rgba(192, 132, 252, 0.35);
      }
      80%, 100% {
        transform: rotateY(-180deg);
        background: #ede9fe;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
    }

    /* Glow reflection under book */
    .book-glow {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(192, 132, 252, 0.45) 0%, rgba(10, 12, 20, 0) 70%);
      border-radius: 50%;
      filter: blur(5px);
      animation: glow-pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% {
        opacity: 0.5;
        transform: translateX(-50%) scale(0.9);
      }
      50% {
        opacity: 0.85;
        transform: translateX(-50%) scale(1.1);
      }
    }

    /* Ambient Neural Sparks */
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fdf4ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #c084fc, 0 0 10px #a855f7;
      animation: float-spark 2.4s ease-in infinite;
      pointer-events: none;
    }

    .sp-1 { left: 28%; bottom: 6px; animation-delay: 0.2s; }
    .sp-2 { left: 48%; bottom: 12px; animation-delay: 0.9s; }
    .sp-3 { left: 68%; bottom: 4px; animation-delay: 1.6s; }
    .sp-4 { left: 38%; bottom: 10px; animation-delay: 1.2s; }

    @keyframes float-spark {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(1.3);
      }
    }

    /* Status Container & Rotating Sequence */
    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      z-index: 1;
      width: 100%;
    }

    /* Carousel Text Container */
    .text-carousel {
      display: grid;
      place-items: center;
      position: relative;
      width: 100%;
      min-height: 24px;
    }

    .text-phrase {
      grid-area: 1 / 1;
      font-size: 14px;
      font-weight: 500;
      color: #d8b4fe;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      animation: cycle-phrase 9s ease-in-out infinite both;
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
      pointer-events: none;
    }

    .phrase-1 { animation-delay: 0s; }
    .phrase-2 { animation-delay: 3s; }
    .phrase-3 { animation-delay: 6s; }

    @keyframes cycle-phrase {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      4% {
        opacity: 1;
        transform: translateY(0);
      }
      29% {
        opacity: 1;
        transform: translateY(0);
      }
      33.33% {
        opacity: 0;
        transform: translateY(-6px);
      }
      100% {
        opacity: 0;
        transform: translateY(-6px);
      }
    }

    /* Subtle animated dot loader next to active phrase */
    .dot-loader {
      display: inline-flex;
      gap: 3px;
    }

    .dot-loader span {
      width: 4px;
      height: 4px;
      background: #c084fc;
      border-radius: 50%;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    .secondary-msg {
      font-size: 11.5px;
      color: #94a3b8;
      letter-spacing: 0.2px;
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .book-wrapper, .flipping-page, .book-glow, .spark, .dot-loader span {
        animation: none !important;
      }
      .flipping-page {
        display: none;
      }
      .text-phrase {
        animation: none !important;
        opacity: 0;
      }
      .phrase-1 {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <!-- Header -->
  <div class="header">
    <img src="favicon-32.png" alt="Logo" class="header-logo" onerror="this.style.display='none'" />
    <span class="header-title">Omnitome</span>
  </div>

  <!-- Stage: Book Flipping Animation -->
  <div class="stage">
    <div class="spark sp-1"></div>
    <div class="spark sp-2"></div>
    <div class="spark sp-3"></div>
    <div class="spark sp-4"></div>

    <div class="book-wrapper">
      <div class="book">
        <!-- Hardcovers -->
        <div class="book-cover left"></div>
        <div class="book-cover right"></div>

        <!-- Static Base Pages -->
        <div class="page-base left"><div class="page-lines"></div></div>
        <div class="page-base right"><div class="page-lines"></div></div>

        <!-- Spine -->
        <div class="book-spine"></div>

        <!-- Flipping Pages -->
        <div class="flipping-page p1"><div class="page-lines"></div></div>
        <div class="flipping-page p2"><div class="page-lines"></div></div>
        <div class="flipping-page p3"><div class="page-lines"></div></div>
      </div>
      <div class="book-glow"></div>
    </div>
  </div>

  <!-- Status Info: Rotating Phrases -->
  <div class="status-container">
    <div class="text-carousel">
      <div class="text-phrase phrase-1">
        <span>Setting up the Omnitome...</span>
        <div class="dot-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="text-phrase phrase-2">
        <span>Building your library...</span>
        <div class="dot-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="text-phrase phrase-3">
        <span>Turning on the engines...</span>
        <div class="dot-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <div class="secondary-msg">First launch may take 1-2 minutes.</div>
  </div>
</body>
</html>
